[project]
name = "petshop-helper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncmy>=0.2.9",
    "cryptography>=46.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langchain>=1.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.3",
    "langchain-text-splitters>=1.1,<2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langfuse>=4,<5",
    "mcp>=1.24,<2",
    "milvus-lite==3.2.1",
    "openai>=3,<4",
    "pydantic-settings>=2.15.0",
    "pymilvus==3.0.2",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
ml = [
    "torch>=2.5,<3",
    "transformers>=4.57,<5",
    "scikit-learn>=1.7,<2",
    "numpy>=2,<3",
    "onnx>=1.18,<2",
    "onnxruntime>=1.22,<2",
    "tokenizers>=0.22,<1",
    "accelerate>=1.12,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
