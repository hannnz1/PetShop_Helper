<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观测与用量 · PetShop Helper</title><link rel="stylesheet" href="/static/operations.css"></head>
<body data-page="observability"><div id="adminNav"></div><main><h1>观测与用量</h1><p class="muted">从本机账本读取已测量用量。缺失数据保留为空，不估算费用，也不把部分评估当作达标。</p>
<section><form id="connect" class="inline"><label>观测凭据<input id="token" type="password" autocomplete="off" required></label><label>开始日期<input id="from" type="date" required></label><label>结束日期<input id="to" type="date" required></label><label>评估集指纹<input id="dataset" placeholder="留空使用当前评估集"></label><label>检索策略<select id="strategy"><option>hybrid_rerank</option><option>hybrid</option><option>vector</option><option>bm25</option></select></label><button>刷新报告</button><button type="button" id="forget" class="secondary">清除凭据</button></form></section><p id="notice" role="status"></p>
<section><h2>已测量用量</h2><div id="cost">尚未加载</div></section><section><h2>评估趋势</h2><div id="trend">尚未加载</div></section><section><h2>证据置信度校准</h2><div id="calibration">尚未加载</div><button id="calibrate">重新校准</button><button id="jobStatus" class="secondary">查询校准作业</button><pre id="job"></pre><small>重新校准会调用查询改写、嵌入和精排服务，可能产生费用。</small></section></main><script src="/static/admin.js"></script><script src="/static/operations.js"></script></body></html>
