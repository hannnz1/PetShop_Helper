<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人工审核 · PetShop Helper</title><link rel="stylesheet" href="/static/operations.css"></head>
<body data-page="review"><div id="adminNav"></div><main><h1>人工审核</h1><p class="muted">先核对原始问题与草稿，再填写正式答案。人工批准后仍需发布和向量化，才能进入检索。</p>
<section><form id="connect" class="inline"><label>审核凭据<input id="token" type="password" autocomplete="off" required></label><button>连接并加载</button><button type="button" id="forget" class="secondary">清除凭据</button></form><small>凭据只保留在当前页面，刷新或离开后清除。</small></section><p id="notice" role="status"></p>
<div class="grid"><section><h2>待审核问题</h2><div id="queue" class="list"></div><button id="previous" class="secondary">上一页</button><button id="next" class="secondary">下一页</button><span id="paging"></span></section>
<section><h2>问题详情</h2><div id="detail">连接后选择一条问题。</div><form id="decision" hidden><fieldset><label>处理方式<select id="action"><option value="approve">批准</option><option value="defer">暂缓</option><option value="reject">拒绝</option><option value="merge">合并</option></select></label><label>分类<input id="category" maxlength="64"></label><label>人工确认的正式答案<textarea id="answer"></textarea></label><label>审核理由<textarea id="reason"></textarea></label><label>合并到问题 ID<input id="mergeTarget" type="number" min="1"></label><button>保存审核决定</button></fieldset></form><div id="publishActions" hidden><button id="publish">发布批准答案</button><button id="vectorize">重试向量化</button><small>向量化重试处理全部待处理知识块，需再次确认；失败会保留人工审核决定。</small><div id="vectorConfirm" hidden><p>将向量化全部待处理知识块，可能产生嵌入服务费用。确认继续？</p><button id="vectorConfirmSubmit">确认处理全部待向量知识</button><button id="vectorCancel" class="secondary">取消</button></div></div></section></div></main><script src="/static/admin.js"></script><script src="/static/operations.js"></script></body></html>
